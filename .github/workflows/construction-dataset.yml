name: Restore construction dataset and report failures
on:
  push:
    branches: [construction-dataset]
    paths: ['.github/workflows/construction-dataset.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install Pillow==13.0.0 numpy
      - name: Restore and verify dataset
        run: python construction-dataset/restore.py
      - name: Preserve diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-reports
          path: |
            construction-dataset/*status.jsonl
            construction-dataset/restore-summary.json
          if-no-files-found: warn
      - name: Publish archive and verification reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "interiors-${GITHUB_RUN_ID}" --target "$GITHUB_SHA" --title "Restored interior dataset ${GITHUB_RUN_ID}" --notes-file construction-dataset/restore-summary.json construction-dataset/interiors-restored.tar.gz construction-dataset/restore-summary.json construction-dataset/download-status.jsonl construction-dataset/mask-status.jsonl
