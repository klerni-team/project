name: Train all eligible interiors annotations
on:
  push:
    branches: [construction-dataset]
    paths: ['.github/workflows/interiors-training.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU training dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install transformers==4.57.1 pillow==13.0.0 scipy==1.16.3 matplotlib==3.10.7
      - name: Download verified dataset and pretrained weights
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download interiors-trained-43634325158 --pattern interiors-stage1-heads.tar.gz --dir /tmp/previous
          gh release download interiors-43632266881 --pattern interiors-restored.tar.gz --dir /tmp/data
          gh release download interiors-model-43633804001 --pattern mask2former-interiors-baseline.tar.gz --dir /tmp/base
          python - <<'PY'
          import tarfile, shutil
          from pathlib import Path
          Path("training-data").mkdir()
          with tarfile.open("/tmp/previous/interiors-stage1-heads.tar.gz") as t: t.extractall("/tmp/parent", filter="data")
          shutil.move("/tmp/parent/trained-interiors", "previous")
          with tarfile.open("/tmp/data/interiors-restored.tar.gz") as t: t.extractall("training-data", filter="data")
          with tarfile.open("/tmp/base/mask2former-interiors-baseline.tar.gz") as t: t.extractall(".", filter="data")
          PY
          (cd model-package && sha256sum -c SHA256SUMS)
          (cd previous && sha256sum -c SHA256SUMS)
      - name: Continue 20 epochs across all eligible labeled images
        run: python -u construction-dataset/model/train_all.py
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interiors-all-training
          path: trained-all/
          if-no-files-found: warn
      - name: Publish trained heads and metrics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "interiors-trained-${GITHUB_RUN_ID}" --target "$GITHUB_SHA" --title "Interiors: continued training on all eligible annotations" --notes-file trained-all/training-report.json interiors-all-heads.tar.gz trained-all/training-report.json trained-all/history.json trained-all/split.json trained-all/coverage.json trained-all/learning-curves.png
