name: Recover rate-limited DMS training photos
on:
  push:
    branches: [construction-dataset]
    paths: ['.github/workflows/material-dms-recovery.yml']
  workflow_dispatch:
concurrency:
  group: material-expansion
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      MAX_NEW_CANDIDATES: '15000'
      RECOVER_RATE_LIMITED: '1'
      DATA_RELEASE: materials-dms-recovery-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validation dependencies
        run: python -m pip install pillow==13.0.0 numpy scipy==1.16.3 opencv-python-headless==4.12.0.88
      - name: Get prior photos for overlap exclusion
        run: |
          gh release download interiors-43632266881 --pattern interiors-restored.tar.gz --dir /tmp/prior
          python - <<'PY'
          import tarfile
          with tarfile.open("/tmp/prior/interiors-restored.tar.gz") as t: t.extractall("old-data",filter="data")
          PY
          rm /tmp/prior/interiors-restored.tar.gz
      - name: Download all prior collection manifests and audits
        run: |
          for tag in materials-dms-43685792992 materials-dms-43720376332 materials-dms-43740576307; do
            gh release download "$tag" --pattern manifest.jsonl --pattern collection-audit.json --dir "previous-data/$tag"
          done
          for tag in materials-opensurfaces-43746023532 materials-multilum-43750528541 materials-opensurfaces-sa-43754949491 materials-opensurfaces-nc-43761049909 materials-cocostuff-43770328104 materials-cocostuff-recovery-43777276739; do
            gh release download "$tag" --pattern manifest.jsonl --dir "previous-data/$tag"
          done
      - name: Create staging release
        run: gh release create "$DATA_RELEASE" --draft --target "$GITHUB_SHA" --title "Recovered DMS indoor material pairs — research only" --notes "Prior rate-limited DMS train candidates recovered from distributed CVDF copies. Author and source photo rights are recorded per row. DMS masks retain CC BY-NC 4.0."
      - name: Collect and verify photos and material masks
        run: python -u construction-dataset/material-expansion/collect_next.py
      - name: Publish complete collection and audit
        run: |
          gh release upload "$DATA_RELEASE" material-expansion/manifest.jsonl material-expansion/taxonomy.json material-expansion/collection-report.json material-expansion/collection-audit.json material-expansion/ATTRIBUTION.md material-expansion/SHA256SUMS material-expansion/candidate-pool.json
          gh release edit "$DATA_RELEASE" --draft=false
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: material-collection-reports
          path: material-expansion/*.json
          if-no-files-found: warn
