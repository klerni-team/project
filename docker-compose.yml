services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TRUST_PROXY: "1"
    volumes:
      # Named volume: Docker copies the image's /data (owned by `node`) into it.
      # A bind mount like ./data would be created root-owned and unwritable.
      - app_data:/data
    expose:
      - "8787"

  # HTTPS is required for the PWA on iPhone (service worker, "Add to Home Screen").
  # Caddy gets a Let's Encrypt certificate for DOMAIN automatically.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app

volumes:
  app_data:
  caddy_data:
